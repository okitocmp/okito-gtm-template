versions:
  - sha: 4648de9386b06d4f90b5fff4b9c78ebd89a606dc
    changeNotes: New "My banner uses IAB TCF" setting (off by default). When ticked, the tag adds the IAB TCF API stub (__tcfapi), so Google tags that start before the Okito script loads still find the TCF API and receive the TC string. Tick it if IAB TCF is on in your Okito dashboard.
  - sha: c6952d1ea4493c86bf05d8aa32e4e96b986b362e
    changeNotes: Pass ad click information through URLs (url_passthrough) is now off by default, matching Okito Banner Builder. Turn it on in the tag settings if you need it.
  - sha: e7151a1380f9a5f1ed53e244813c872f559bdc39
    changeNotes: Region-specific defaults table (override the default consent state per country or ISO 3166-2 region).
  - sha: bda564c9c513e2f77f389b286ca91358236477d9
    changeNotes: Region-aware Consent Mode defaults (opt-in regions denied, elsewhere granted), Global Privacy Control support, "where consent is not required" and US opt-out settings.
  - sha: 67f2aa24866f6a86506a9c224e0559c815673351
    changeNotes: Initial release.
